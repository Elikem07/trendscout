[project]
name = "trendscout-api"
version = "0.1.0"
description = "TrendScout backend: API, workers, and ML pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",
    "svix>=1.30",
    "httpx>=0.27",
    "pgvector>=0.3",
    "celery[redis]>=5.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "ruptures>=1.1",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "pyjwt[crypto]>=2.9",
    "svix>=1.30",
    "httpx>=0.27",
    "pgvector>=0.3",
    "celery[redis]>=5.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "ruptures>=1.1",
    "httpx>=0.27",
    "celery[redis]>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fakeredis>=2.23",
    "celery-types>=0.22",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.db", "app.ingest", "app.semantic", "app.scoring", "app.data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
"app/data/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "sklearn.*", "ruptures.*", "statsmodels.*", "celery.*", "pandas.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
